<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODSOFT Task 3 - To-Do List REST API</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <span class="badge">TASK 3</span>
        <h1>To-Do List Backend API</h1>
      </div>
      <div class="meta">
        <a href="/docs.html" class="doc-link" target="_blank">📖 Swagger Docs</a>
        <span class="badge-codsoft">CodSoft CIP</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- User Auth Status Bar -->
    <div class="auth-bar">
      <div id="user-info">Logged in as: <strong>Yaswanth Bose (Demo Account)</strong></div>
      <div>
        <button class="btn btn-sm btn-secondary" onclick="openAuthModal()">🔑 Switch / Login Account</button>
      </div>
    </div>

    <!-- Stats summary -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Total Tasks</div>
        <div class="stat-val" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Pending</div>
        <div class="stat-val" id="stat-pending" style="color: #f59e0b;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Completed</div>
        <div class="stat-val" id="stat-completed" style="color: #10b981;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Urgent Priority</div>
        <div class="stat-val" id="stat-urgent" style="color: #ef4444;">0</div>
      </div>
    </div>

    <!-- Filters & Action -->
    <div class="action-bar">
      <div class="search-box">
        <input type="text" id="task-search" placeholder="Search tasks..." oninput="loadTasks()">
        <select id="status-filter" onchange="loadTasks()">
          <option value="">All Statuses</option>
          <option value="0">⏳ Pending</option>
          <option value="1">✅ Completed</option>
        </select>
        <select id="priority-filter" onchange="loadTasks()">
          <option value="">All Priorities</option>
          <option value="urgent">🔴 Urgent</option>
          <option value="high">🟠 High</option>
          <option value="medium">🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
        <select id="category-filter" onchange="loadTasks()">
          <option value="">All Categories</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
          <option value="personal">Personal</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="openTaskModal()">+ Add New Task</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="task-container">
      <div class="loading">Loading tasks...</div>
    </div>
  </main>

  <!-- Task Modal -->
  <div id="task-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="task-modal-title">Task Details</h3>
        <button class="close-btn" onclick="closeModals()">&times;</button>
      </div>
      <form id="task-form" onsubmit="saveTask(event)">
        <input type="hidden" id="t-id">
        <div class="form-group">
          <label>Task Title *</label>
          <input type="text" id="t-title" placeholder="e.g. Implement REST API" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="t-desc" rows="3" placeholder="Additional task details..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Priority</label>
            <select id="t-priority">
              <option value="medium">Medium</option>
              <option value="urgent">Urgent</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="t-category">
              <option value="work">Work</option>
              <option value="study">Study</option>
              <option value="personal">Personal</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" id="t-duedate" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;">Save Task</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>User Authentication (JWT)</h3>
        <button class="close-btn" onclick="closeModals()">&times;</button>
      </div>
      <div class="tabs-sub">
        <button class="subtab-btn active" id="btn-login-tab" onclick="switchAuthTab('login')">Login</button>
        <button class="subtab-btn" id="btn-reg-tab" onclick="switchAuthTab('register')">Register</button>
      </div>
      <form id="auth-form" onsubmit="submitAuth(event)">
        <div class="form-group" id="group-reg-name" style="display:none;">
          <label>Full Name</label>
          <input type="text" id="auth-name" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="auth-email" placeholder="user@example.com" value="yaswanth@codsoft.dev" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="auth-password" placeholder="••••••••" value="password123" required />
        </div>
        <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="width:100%;margin-top:10px;">Login</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
